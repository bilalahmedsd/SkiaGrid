name: Build and Release WPF App

on:
  push:
    tags:
      - 'v*' # Jab bhi aap tag banayein ge (e.g., v1.0.0), yeh chalega

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore SkiaSharpControls.sln

    - name: Publish WPF App
      run: dotnet publish SkiaSharpControls.sln --configuration Release --output ./publish

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SkiaGrid-Windows-Release
        path: ./publish/
